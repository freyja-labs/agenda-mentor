# Site settings. `repo` is the GitHub owner/name that hosts this site; links to source
# files on the site point there. Change it if the repository moves.
site_name: Agenda Mentor
tagline: Research agendas drafted from your own whiteboard, checked against your record, and tracked with a mentor.
repo: freyja-labs/agenda-mentor
branch: main
# The address the site is served at, with a trailing slash. Canonical links, the sitemap,
# the 404 page, and the schema's $id are built from it.
site_url: https://mentor.freyjalabs.com/
# Named in the footer and on the About page.
publisher:
  name: Freyja Labs
  url: https://freyjalabs.com
# Shown in the footer. Leave empty for no institution.
host_note: ""
# Facultory, the hosted place to keep an agenda. The build composes the sign-up and
# sign-in links from these values. They name this site as the source and carry
# nothing a visitor typed.
facultory:
  url: https://facultory.com
  # The page the links open after sign-in: the Research Agenda tool.
  next: "#/agenda"
  # The plan the signup form selects first: the least expensive plan that includes
  # Research Agenda. Scheduling does not include it.
  plan: noai
  # Fills in "How did you hear about Facultory?", so signups from here are counted.
  heard: Agenda Mentor
